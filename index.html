<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>입트기 학습카드</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2f56d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="입트기">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root {
  /* 폰 한 손 조작: 상단 진행·필터, 가운데 카드, 하단 엄지 버튼 */
  --paper: #eef1f6;
  --card: #ffffff;
  --ink: #18202f;
  --muted: #5b6477;
  --line: #d9deea;
  --accent: #2f56d9;
  --mark: #ffe066;
  --mark-ink: #18202f;
  --t-lesson: #2f56d9;
  --t-pron: #7a3fd1;
  --t-mission: #c45a12;
  --t-review: #1d8a55;
  --f-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #10141c; --card: #1a202c; --ink: #e9edf5; --muted: #9ba5b9; --line: #2c3444;
    --accent: #8aa4ff; --mark: #e3c33a; --mark-ink: #141821;
    --t-lesson: #8aa4ff; --t-pron: #c09bff; --t-mission: #f0a066; --t-review: #5fd09a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #10141c; --card: #1a202c; --ink: #e9edf5; --muted: #9ba5b9; --line: #2c3444;
  --accent: #8aa4ff; --mark: #e3c33a; --mark-ink: #141821;
  --t-lesson: #8aa4ff; --t-pron: #c09bff; --t-mission: #f0a066; --t-review: #5fd09a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--paper); color: var(--ink); font-family: var(--f-body);
  font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent;
}
.wrap { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 120px; display: flex; flex-direction: column; gap: 14px; }
header { display: flex; flex-direction: column; gap: 10px; }
.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 20px; margin: 0; font-weight: 700; text-wrap: balance; }
.prog { font-family: var(--f-mono); font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--mark); transition: width .3s; }
.dots { display: flex; gap: 6px; flex-wrap: wrap; }
.dot {
  font-family: var(--f-mono); font-size: 13px; min-width: 40px; height: 34px; padding: 0 8px;
  border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 8px; cursor: pointer;
  font-variant-numeric: tabular-nums;
}
.dot.known { background: var(--mark); color: var(--mark-ink); border-color: transparent; }
.dot.cur { outline: 2px solid var(--accent); outline-offset: 1px; }
.tools { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: transparent; color: var(--muted); cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* card */
.scene { perspective: 1400px; }
.card { display: grid; transition: transform .5s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; cursor: pointer; }
.card.flipped { transform: rotateY(180deg); }
.face {
  grid-area: 1 / 1; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  background: var(--card); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 14px;
  box-shadow: 0 1px 0 rgba(0,0,0,.03), 0 10px 30px -18px rgba(20,30,60,.35);
}
.back { transform: rotateY(180deg); }
.face-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.num { font-family: var(--f-mono); font-weight: 600; font-size: 14px; color: var(--muted); }
.type { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 6px; border: 1px solid currentColor; }
.type.lesson { color: var(--t-lesson); } .type.pron { color: var(--t-pron); }
.type.mission { color: var(--t-mission); } .type.review { color: var(--t-review); }
.side { margin-left: auto; font-size: 12px; color: var(--muted); }
h2 { font-size: 19px; line-height: 1.35; margin: 0; font-weight: 700; text-wrap: balance; }
.inst { font-size: 14px; color: var(--muted); margin: -6px 0 0; }
ol.items { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 0; counter-reset: n; }
ol.items li { counter-increment: n; display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; padding: 11px 0; border-top: 1px dashed var(--line); }
ol.items li:first-child { border-top: 0; }
ol.items li::before { content: counter(n); font-family: var(--f-mono); font-size: 13px; color: var(--muted); padding-top: 2px; grid-row: span 4; }
.ko { font-size: 17px; font-weight: 500; }
.en { font-size: 18px; font-weight: 700; letter-spacing: -.005em; }
.sub { font-size: 14px; color: var(--muted); }
.note { font-size: 13px; color: var(--muted); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; background: var(--mark); color: var(--mark-ink); margin-left: 6px; vertical-align: 2px; }
.script { background: var(--paper); border-radius: 12px; padding: 14px; font-size: 17px; line-height: 1.8; }
.blank { display: inline-block; min-width: 56px; border-bottom: 2px solid var(--ink); margin: 0 2px; }
.opt { color: var(--muted); font-size: 14px; }
.trans { font-size: 14px; color: var(--muted); }
.dialog { display: flex; flex-direction: column; gap: 8px; }
.dialog p { margin: 0; display: grid; grid-template-columns: 24px 1fr; gap: 6px; }
.dialog b { font-family: var(--f-mono); color: var(--muted); font-weight: 600; }
.hint { font-size: 13px; color: var(--muted); text-align: center; margin-top: auto; }
mark { background: var(--mark); color: var(--mark-ink); padding: 0 2px; border-radius: 3px; }

/* bottom bar */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; background: color-mix(in srgb, var(--paper) 88%, transparent);
  backdrop-filter: blur(8px); border-top: 1px solid var(--line); padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
}
.dock-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 56px 1fr 1fr 56px; gap: 8px; }
.btn {
  font: inherit; font-weight: 600; font-size: 15px; height: 50px; border-radius: 12px; border: 1px solid var(--line);
  background: var(--card); color: var(--ink); cursor: pointer;
}
.btn.primary { background: var(--accent); color: #fff; border-color: transparent; }
:root[data-theme="dark"] .btn.primary { color: #10141c; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { color: #10141c; } }
.btn.known { background: var(--mark); color: var(--mark-ink); border-color: transparent; }
button:focus-visible, .card:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.empty { text-align: center; color: var(--muted); padding: 40px 0; }
.say {
  font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--line); background: var(--paper);
  color: var(--accent); border-radius: 8px; padding: 3px 9px; cursor: pointer; justify-self: start; margin-top: 4px;
}
.say[data-busy="1"] { background: var(--accent); color: var(--card); border-color: transparent; }
.panel {
  background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px;
  display: flex; flex-direction: column; gap: 14px;
}
.panel h3 { margin: 0; font-size: 15px; font-weight: 700; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.tool {
  font: inherit; font-size: 14px; font-weight: 600; height: 42px; padding: 0 14px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer; flex: 1 1 auto;
}
.tool.accent { background: var(--accent); color: var(--card); border-color: transparent; }
.small { font-size: 13px; color: var(--muted); margin: 0; }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; }
.steps label { display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: start; padding: 8px 0; cursor: pointer; }
.steps input { width: 20px; height: 20px; margin: 2px 0 0; accent-color: var(--accent); }
.steps b { font-weight: 600; }
.steps span.d { display: block; font-size: 13px; color: var(--muted); }
.steps input:checked + span b { text-decoration: line-through; color: var(--muted); }
.copybox { width: 100%; min-height: 110px; font: inherit; font-size: 14px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--paper); color: var(--ink); }
.toast { font-size: 13px; color: var(--t-review); font-weight: 600; min-height: 1em; }
@media (prefers-reduced-motion: reduce) { .card, .bar > i { transition: none; } }

/* 연습 패널 */
.pick { display: flex; gap: 6px; flex-wrap: wrap; }
.pick button {
  font-family: var(--f-mono); font-size: 13px; min-width: 38px; height: 34px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--paper); color: var(--ink); cursor: pointer;
}
.pick button[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.pick button.has-rec::after { content: "●"; color: var(--t-mission); font-size: 9px; margin-left: 3px; vertical-align: 2px; }
.target { background: var(--paper); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; }
.target .en { font-size: 20px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.tool:disabled { opacity: .45; cursor: default; }
.tool.rec { background: var(--t-mission); color: #fff; border-color: transparent; }
.tool.rec.on { animation: pulse 1s infinite; }
@keyframes pulse { 50% { opacity: .65; } }
.result { border-radius: 12px; border: 1px solid var(--line); padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.result[hidden] { display: none; }
.heard { font-size: 17px; font-weight: 600; }
.words { display: flex; flex-wrap: wrap; gap: 4px 6px; font-size: 16px; font-weight: 600; }
.words .ok { color: var(--t-review); }
.words .miss { color: var(--t-mission); text-decoration: underline wavy; text-underline-offset: 4px; }
.score { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }
.install { font-size: 13px; color: var(--muted); background: var(--card); border: 1px dashed var(--line); border-radius: 12px; padding: 10px 14px; margin: 0; }
.install[hidden] { display: none; }
.dock-in { grid-template-columns: 56px 1fr 1fr 56px; }
.say { margin-right: 6px; }
#qIdle, #qRun, #qDone { display: flex; flex-direction: column; gap: 12px; }
#qIdle[hidden], #qRun[hidden], #qDone[hidden], #qAsk[hidden], #qSelf[hidden], #qAfter[hidden] { display: none; }
.qhead { display: flex; justify-content: space-between; align-items: center; }
.qcard { min-height: 96px; justify-content: center; }
.qko { font-size: 21px; font-weight: 600; }
.qcard .en[hidden] { display: none; }
.qverdict { font-size: 16px; font-weight: 700; margin: 0; }
.qverdict.good { color: var(--t-review); }
.qverdict.bad { color: var(--t-mission); }
.focus { margin: 0; font-size: 16px; font-weight: 700; line-height: 1.5; }
.focus .lab { display: inline-block; font-size: 12px; padding: 1px 7px; border-radius: 5px; background: var(--mark); color: var(--mark-ink); margin-right: 6px; vertical-align: 2px; }
.metrics { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.metrics li { display: grid; grid-template-columns: 58px 1fr auto; gap: 8px; align-items: baseline; padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.metrics li b { font-weight: 600; }
.metrics .st { font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 5px; border: 1px solid currentColor; white-space: nowrap; }
.metrics .st.good { color: var(--t-review); }
.metrics .st.warn { color: var(--t-mission); }
.metrics .st.na { color: var(--muted); }
.say.slow { color: var(--muted); }

/* ---- UI 정리: 탭, 3단계 연습, 오늘 할 일 ---- */
.tool svg, .tabs svg { width: 18px; height: 18px; vertical-align: -3px; margin-right: 6px; flex: none; }
.tool { display: inline-flex; align-items: center; justify-content: center; }
.tool.big { height: 52px; font-size: 16px; }
.panel h3 { font-size: 16px; }
.tabs { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--line); border-radius: 14px; }
.tabs button {
  font: inherit; font-size: 15px; font-weight: 600; height: 44px; border: 0; border-radius: 10px;
  background: transparent; color: var(--muted); cursor: pointer; display: inline-flex; align-items: center; justify-content: center;
}
.tabs button[aria-selected="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.panel[hidden] { display: none; }

.stage { border: 1px solid var(--line); border-left: 5px solid var(--sc); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.s-listen { --sc: var(--accent); }
.s-rec { --sc: var(--t-mission); }
.s-check { --sc: var(--t-review); }
.stage-h { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; color: var(--sc); }
.stage-h svg { width: 20px; height: 20px; }
.stage-h b { color: var(--ink); font-size: 16px; }
.stage-d { color: var(--muted); font-size: 13px; margin-left: auto; }
.badge { width: 22px; height: 22px; border-radius: 50%; background: var(--sc); color: var(--card); font-family: var(--f-mono); font-size: 13px; font-weight: 600; display: inline-grid; place-items: center; }
.stage .tool.fill { background: var(--sc); color: var(--card); border-color: transparent; }
.stage .tool.fill.on { animation: pulse 1s infinite; }
.foot { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

.today { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 0 16px; }
.today summary { list-style: none; display: flex; align-items: center; gap: 10px; min-height: 48px; cursor: pointer; }
.today summary::-webkit-details-marker { display: none; }
.today summary::after { content: "▾"; color: var(--muted); font-size: 13px; }
.today[open] summary::after { content: "▴"; }
.today-t { font-weight: 600; font-size: 15px; }
.pips { display: flex; gap: 4px; margin-left: auto; }
.pips i { width: 9px; height: 9px; border-radius: 50%; background: var(--line); display: block; }
.pips i.on { background: var(--t-review); }
.today-n { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.today .steps { padding-bottom: 10px; }

.pick button.full { padding: 0 12px; font-family: var(--f-body); font-weight: 600; }
.tabs.two { grid-template-columns: repeat(2, 1fr); }
.tabs button[hidden] { display: none; }

.weeks { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.wk { font: inherit; font-size: 14px; font-weight: 600; height: 46px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.2; }
.wk span { font-family: var(--f-mono); font-size: 11px; font-weight: 500; color: var(--muted); }
.wk[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.wk[aria-pressed="true"] span { color: var(--paper); opacity: .75; }
.items[hidden] { display: none; }
.install.warn { border-style: solid; border-color: var(--t-mission); color: var(--ink); }
.install a { color: var(--accent); font-weight: 600; }
.stage .tool.on:not(.fill) { border-color: var(--sc); color: var(--sc); }
</style>

</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-ear" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8.5a4.5 4.5 0 0 1 0 7M18.5 6a8 8 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4 12.5l5 5L20 6.5" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-quiz" viewBox="0 0 24 24"><path d="M5 4h14v12H9l-4 4V4z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M10 8.5a2 2 0 1 1 2.8 1.8c-.5.3-.8.7-.8 1.2M12 13.6v.1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
  <symbol id="i-practice" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-claude" viewBox="0 0 24 24"><path d="M12 3v4M12 17v4M3 12h4M17 12h4M5.6 5.6l2.8 2.8M15.6 15.6l2.8 2.8M5.6 18.4l2.8-2.8M15.6 8.4l2.8-2.8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
</svg>

<div class="wrap">
  <header>
    <div class="top">
      <h1>입트기 학습카드 · Part 1</h1>
      <span class="prog" id="prog">외운 카드 0/24</span>
    </div>
    <div class="bar"><i id="barFill"></i></div>
    <div class="weeks" id="weeks" aria-label="주차 고르기"></div>
    <div class="dots" id="dots" aria-label="카드 목록"></div>
    <div class="tools">
      <button class="chip" id="onlyLeft" aria-pressed="false">안 외운 카드만</button>
      <button class="chip" id="shuffle" aria-pressed="false">순서 섞기</button>
    </div>
  </header>

  <p class="install" id="installHint" hidden></p>
  <p class="install warn" id="ttsWarn" hidden></p>

  <div class="scene">
    <div class="card" id="card" tabindex="0" role="button" aria-label="카드 뒤집기">
      <section class="face front" id="front"></section>
      <section class="face back" id="back"></section>
    </div>
  </div>

  <details class="today" id="today">
    <summary>
      <span class="today-t">오늘 할 일 · <span id="stepCard">1강</span></span>
      <span class="pips" id="pips" aria-hidden="true"></span>
      <span class="today-n" id="todayN">0/5</span>
    </summary>
    <ul class="steps" id="steps"></ul>
  </details>

  <div class="tabs" role="tablist" aria-label="연습 방법">
    <button role="tab" id="tab-practice" aria-controls="pane-practice" aria-selected="true"><svg><use href="#i-practice"/></svg>문장 연습</button>
    <button role="tab" id="tab-quiz" aria-controls="pane-quiz" aria-selected="false"><svg><use href="#i-quiz"/></svg>퀴즈</button>
    <button role="tab" id="tab-claude" aria-controls="pane-claude" aria-selected="false"><svg><use href="#i-claude"/></svg>AI 연습</button>
  </div>

  <!-- 퀴즈 -->
  <section class="panel" role="tabpanel" id="pane-quiz" aria-labelledby="tab-quiz">
    <div id="qIdle">
      <h3>한국어를 보고 영어로 말하기</h3>
      <p class="small" id="qIntro"></p>
      <button class="tool accent big" id="qStart">퀴즈 시작</button>
    </div>
    <div id="qRun" hidden>
      <div class="qhead"><span class="score" id="qCount"></span><button class="chip" id="qQuit">그만하기</button></div>
      <div class="target qcard">
        <span class="ko qko" id="qKo"></span>
        <span class="en" id="qAns" hidden></span>
      </div>
      <div class="grid2" id="qAsk">
        <button class="tool rec" id="qSpeak"><svg><use href="#i-mic"/></svg>말하기</button>
        <button class="tool" id="qReveal">모르겠어요</button>
      </div>
      <div class="result" id="qRes" hidden>
        <span class="qverdict" id="qVerdict"></span>
        <span class="heard" id="qHeard"></span>

const TTS = "speechSynthesis" in window;
const ttsDur = {};
let voice = null;
function pickVoice() {
  if (!TTS) return;
  const vs = speechSynthesis.getVoices().filter(v => /^en[-_]US/i.test(v.lang));
  const pref = ["Samantha", "Google US English", "Microsoft Aria", "Microsoft Jenny", "Ava", "Allison", "Nicky"];
  voice = pref.map(p => vs.find(v => v.name.includes(p))).find(Boolean) || vs[0] || null;
}
if (TTS) { pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function speak(list, rate) {
  return new Promise(res => {
    if (!TTS) return res();
    speechSynthesis.cancel();
    if (!list.length) return res();
    list.forEach((t, i) => {
      const u = new SpeechSynthesisUtterance(t);
      u.lang = "en-US"; if (voice) u.voice = voice; u.rate = rate;
      // 원어민 음성 길이를 기억해 두었다가 속도 분석에 써요 (보통 속도 기준으로 환산)
      let t0 = 0;
      u.onstart = () => { t0 = performance.now(); };
      u.addEventListener("end", () => { if (t0) { const d = (performance.now() - t0) / 1000 * rate; if (d > 0.3) ttsDur[t] = d; } });
      if (i === list.length - 1) u.onend = u.onerror = () => res();
      speechSynthesis.speak(u);
    });
  });
}
function sayBtns(text) {

}

});

function pickMime() {
  const opts = ["audio/mp4", "audio/webm;codecs=opus", "audio/webm", "audio/aac"];
  return opts.find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
}
$("pRec").onclick = async () => {
  const btn = $("pRec");
  if (recorder && recorder.state === "recording") { recorder.stop(); return; }
  if (!REC_OK) { $("pNote").textContent = "이 브라우저는 녹음을 지원하지 않아요. Safari(아이폰)나 Chrome(갤럭시)으로 열어 주세요."; return; }
  stopAll();
  getCtx();
  let stream;
  if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); micStream = stream; }
  catch (e) { $("pNote").textContent = "마이크 사용이 허용되지 않았어요. 휴대폰 설정에서 이 브라우저의 마이크를 허용해 주세요."; return; }
  const mime = pickMime();
  recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
  chunks = [];
  const k = key();
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    stream.getTracks().forEach(t => t.stop()); if (micStream === stream) micStream = null;
    clearInterval(recTimer);
    btn.textContent = REC_LABEL; btn.classList.remove("on");
    const sentence = target(), isFull = !!lines(cur())[sel].full;

      recs[k] = URL.createObjectURL(blob); recBlobs[k] = blob;
    }
    if (cur() && key() === k) {
      renderPractice(cur());
      if (blob) analyze(blob, sentence, k, isFull);
    }
  };
  recorder.start();
  const t0 = Date.now();
  btn.textContent = "정지하고 분석하기 · 0초"; btn.classList.add("on");
  clearInterval(recTimer);
  recTimer = setInterval(() => { if (recorder && recorder.state === "recording") btn.textContent = `정지하고 분석하기 · ${Math.floor((Date.now() - t0) / 1000)}초`; }, 500);
};

    // 결과 정리

    else if (ratio < 0.7) { speedMsg = "원어민보다 빨라요. 서두르지 않아도 돼요"; speedSt = "warn"; }

    else if (isYesNo && tune < 1.05) { tuneMsg = "질문인데 끝이 올라가지 않았어요"; tuneSt = "warn"; }

/* 발음 확인: 휴대폰 음성 인식으로 받아쓰고 정답과 단어 비교 */

      $("qHeard").textContent = ""; $("qWords").innerHTML = "";
    },
    onEnd: () => { btn.classList.remove("on"); btn.innerHTML = MIC_ICON + "말하기"; }
  });
};
$("qReveal").onclick = () => quizJudge(false, "", null);
$("qGood").onclick = () => quizJudge(true, "", null);
$("qBad").onclick = () => quizJudge(false, "", null);
$("qAgain").onclick = () => speak([quiz.cur.en], 0.65);
$("qNext").onclick = () => {
  quiz.i++;
  if (quiz.i < quiz.total) return quizAsk();
  stopAll();
  show("qRun", false); show("qDone", true);
  const s = $("qSummary");
  s.className = "qverdict " + (quiz.wrong.length ? "bad" : "good");
  s.textContent = quiz.wrong.length
    ? `${quiz.total}문장 중 ${quiz.right}개 정답. 틀린 ${quiz.wrong.length}문장을 다시 해 봐요.`
    : `${quiz.total}문장 모두 정답! 이 카드는 '외웠어요'를 눌러도 좋아요.`;
  show("qRetry", quiz.wrong.length > 0);
};
$("qRetry").onclick = () => quizStart(quiz.wrong);
$("qRestart").onclick = () => quizStart(lines(cur()).filter(l => !l.full));

/* ---------- Claude와 연습 ---------- */
const CLAUDE = {
  5: { desc: "Claude 음성 모드에서 아래 문장을 읽고 내 자기소개를 말해 보세요. 알아듣기 어려웠던 부분을 알려줘요.",
       text: "나는 영어 왕초보야. 지금부터 영어로 30초 자기소개를 할게. 다 들으면 네가 들은 문장을 글자 그대로 다시 말해주고, 알아듣기 어려웠던 단어와 더 자연스럽게 고칠 문장을 딱 하나씩만 쉬운 한국어로 알려줘." },
  11: { desc: "Claude 음성 모드에서 아래 문장을 읽고 오늘 내 기분을 30초 동안 말해 보세요. 알아듣기 어려웠던 부분과 고칠 문장을 알려줘요.",
        text: "나는 영어 왕초보야. 지금부터 영어로 오늘 내 기분을 30초 동안 말할게. 다 들으면 네가 들은 문장을 글자 그대로 다시 말해주고, 알아듣기 어려웠던 단어와 더 자연스럽게 고칠 문장을 딱 하나씩만 쉬운 한국어로 알려줘. 그다음 How about you?에 대한 너의 대답을 아주 쉬운 영어로 한두 문장만 해줘." },
  12: { desc: "예시 대화를 외운 뒤 'Claude에서 열기'를 누르면 위로하기 상황극이 시작돼요. 두 번째에는 Amy의 기분을 바꿔 달라고 해요.",
        text: "상황극 하자. 너는 내 친구 Amy인데 오늘 피곤하고 조금 아파. 나는 영어 왕초보야. 내가 먼저 Are you okay?라고 물어볼게. 짧고 쉬운 문장으로 한 번에 한 문장씩 대답해줘. 끝나면 내가 쓴 위로 표현 중 잘한 점 하나와 고칠 점 하나를 알려줘." },
  18: { desc: "가족 사진을 보면서 Claude 음성 모드에서 아래 문장을 읽고 가족을 소개해 보세요. Claude가 가족에 대해 쉬운 질문도 해줘요.",
        text: "나는 영어 왕초보야. 지금부터 가족 사진을 보면서 영어로 30초 동안 가족을 소개할게. 다 들으면 네가 들은 문장을 글자 그대로 다시 말해주고, 고칠 문장을 딱 하나만 쉬운 한국어로 알려줘. 그다음 내 가족에 대해 Do you have ~? 또는 What do you do? 같은 아주 쉬운 질문을 하나만 해줘." },
  24: { desc: "예시 대화를 외운 뒤 'Claude에서 열기'를 누르면 5분 상황극이 시작돼요. 끝나면 Claude가 알려준 고칠 문장 3개를 다시 암기해요.",
        text: "5분 상황극 하자. 너는 카페에서 처음 만난 외국인이야. 나는 영어 왕초보라서 인사, 기분, 출신, 직업, 가족, 시간에 대한 쉬운 질문만 해줘. 한 번에 한 문장씩 말해줘. 내가 대답을 못 하면 내가 쓸 수 있는 문장을 힌트로 줘. 끝나면 잘한 점 하나와 고칠 문장 세 개를 알려줘." },
  6: { desc: "예시 대화를 외운 뒤, Claude 음성 모드에서 아래 문장을 읽으면 상황극이 시작돼요. 끝나면 역할을 바꿔 한 번 더 해요.",
       text: "상황극 하자. 너는 한국에 처음 온 캐나다 사람 Tom이야. 나는 영어 왕초보라서 아주 쉬운 문장만 써줘. 네가 먼저 Hi로 시작하고, 나한테 이름, 출신, 직업을 물어봐. 한 번에 한 문장씩만 말해줘. 끝나면 내가 틀린 문장을 쉬운 문장으로 고쳐줘." }
};
let currentPrompt = "";
// AI 연습은 대화문 강의(상황극)와 실전미션(내 대본 피드백)에서만 보여요
const hasAI = c => !!c && (!!c.dialog || c.type === "mission");
function renderClaude(c) {
  if (!hasAI(c)) return;
  let p = CLAUDE[c.n];
  if (!p && c.dialog) {
    const d = c.dialog.map(x => `${x[0]}: ${x[1]}`).join(" / ");
    p = { desc: "예시 대화를 외운 뒤 'Claude에서 열기'를 누르면 상황극이 시작돼요. 끝나면 역할을 바꿔 한 번 더 해요.",
          text: `상황극 하자. 나는 영어 왕초보야. 아래 예시 대화와 비슷한 상황에서 네가 B 역할을 해줘. 아주 쉬운 문장만, 한 번에 한 문장씩 말해줘. 네가 먼저 시작해. 끝나면 내가 틀린 문장을 쉬운 문장으로 고쳐줘. 예시 대화: ${d}` };
  }
  if (!p) p = { desc: "'Claude에서 열기'를 누르고 내 대본을 말하면, Claude가 알아듣기 어려운 부분과 고칠 문장을 알려줘요.",
                text: "나는 영어 왕초보야. 지금부터 영어로 짧게 말할게. 다 들으면 네가 들은 문장을 글자 그대로 다시 말해주고, 알아듣기 어려웠던 단어와 더 자연스럽게 고칠 문장을 딱 하나씩만 쉬운 한국어로 알려줘." };
  currentPrompt = p.text;
  $("claudeDesc").textContent = p.desc;
  $("copyBox").hidden = true; $("toast").textContent = "";
}
$("openClaude").onclick = async () => {
  let copied = false;
  try { await navigator.clipboard.writeText(currentPrompt); copied = true; } catch (e) {}
  $("toast").textContent = copied
    ? "Claude를 여는 중이에요. 입력창이 비어 있으면 길게 눌러 붙여넣기 한 뒤 보내 주세요. 음성 모드라면 문장을 그대로 읽어도 돼요."
    : "Claude를 여는 중이에요. 입력창이 비어 있으면 '문장만 복사'로 복사해서 붙여 넣어 주세요.";
  const url = "https://claude.ai/new?q=" + encodeURIComponent(currentPrompt);
  const w = window.open(url, "_blank");
  if (!w) location.href = url;
};
$("copyPrompt").onclick = async () => {
  try {
    await navigator.clipboard.writeText(currentPrompt);
    $("toast").textContent = "복사했어요. Claude 앱에 붙여 넣거나 음성 모드에서 읽어 주세요.";
    $("copyBox").hidden = true;
  } catch (e) {
    const box = $("copyBox"); box.hidden = false; box.value = currentPrompt; box.focus(); box.select();
    $("toast").textContent = "자동 복사가 안 돼서 아래에 문장을 띄웠어요. 길게 눌러 복사해 주세요.";
  }
};

/* ---------- 오늘 할 일 ---------- */
function stepList(c) {
  const s = [
    ["듣기", "'문장 연습' 탭 ① 듣기로 문장마다 3번 듣기"],
    ["따라 말하기", "문장마다 10번, 마지막 3번은 카드 보지 않고"],
    ["녹음하고 분석", "② 녹음 → '고칠 곳 1개'를 고쳐서 다시 녹음"],
    ["발음 확인", "③ 발음 확인에서 모든 단어가 초록색이면 통과"],
    ["퀴즈", "'퀴즈' 탭에서 모든 문장 정답 받기"],
    ["AI와 연습", "'AI 연습' 탭에서 상황극·피드백 연습"]
  ];
  if (c.type === "mission") s.splice(4, 1, ["대본 완성", "빈칸을 내 정보로 채우고 대본 없이 3번 말하기"]);
  if (!hasAI(c)) s.pop();
  return s;
}
function renderSteps(c) {
  $("stepCard").textContent = c.n + "강";
  const done = steps[c.n] || [], list = stepList(c);
  $("steps").innerHTML = list.map((st, i) =>
    `<li><label><input type="checkbox" data-i="${i}"${done.includes(i) ? " checked" : ""}><span><b>${st[0]}</b><span class="d">${st[1]}</span></span></label></li>`).join("");
  renderPips(c);
}
function renderPips(c) {
  const done = (steps[c.n] || []).length, total = stepList(c).length;
  $("pips").innerHTML = Array.from({ length: total }, (_, i) => `<i class="${i < done ? "on" : ""}"></i>`).join("");
  $("todayN").textContent = `${Math.min(done, total)}/${total}`;
}
$("steps").addEventListener("change", e => {
  const c = cur(); if (!c) return;
  const set = new Set(steps[c.n] || []), i = +e.target.dataset.i;
  e.target.checked ? set.add(i) : set.delete(i);
  steps[c.n] = [...set]; store.set("iptgi-steps-w1", steps);
  renderPips(c);
});

/* ---------- 조작 ---------- */
card.addEventListener("click", flip);
card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); flip(); } });
$("flip").onclick = flip;
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("know").onclick = () => {
  const c = cur(); if (!c) return;
  known.has(c.n) ? known.delete(c.n) : known.add(c.n);
  store.set("iptgi-known-w1", [...known]);
  if (onlyLeft) flipped = false;
  render();
};
$("weeks").addEventListener("click", e => {
  const b = e.target.closest(".wk"); if (!b) return;
  week = +b.dataset.w; store.set("iptgi-week", week);
  pos = 0; flipped = false; sel = 0; stopAll(); render();
});
$("dots").addEventListener("click", e => {
  const b = e.target.closest(".dot"); if (!b) return;
  const n = +b.dataset.n;
  if (onlyLeft && known.has(n)) { onlyLeft = false; $("onlyLeft").setAttribute("aria-pressed", "false"); }
  pos = view().findIndex(i => CARDS[i].n === n); flipped = false; sel = 0; stopAll(); render();
});
$("onlyLeft").onclick = e => { onlyLeft = !onlyLeft; e.currentTarget.setAttribute("aria-pressed", onlyLeft); pos = 0; flipped = false; sel = 0; render(); };
$("shuffle").onclick = e => {
  shuffled = !shuffled; e.currentTarget.setAttribute("aria-pressed", shuffled);
  order = CARDS.map((_, i) => i);
  if (shuffled) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
  pos = 0; flipped = false; sel = 0; render();
};
document.addEventListener("keydown", e => {
  if (e.target === card || /INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
let sx = null, sy = null;
card.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; }, { passive: true });
card.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) { e.preventDefault(); go(dx < 0 ? 1 : -1); }
  sx = null;
});

/* ---------- 앱 설치 안내 / 오프라인 ---------- */
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if (!standalone) {
  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent);
  $("installHint").hidden = false;
  $("installHint").textContent = ios
    ? "앱처럼 쓰려면: Safari 아래쪽 공유 버튼 → '홈 화면에 추가'를 눌러요."
    : "앱처럼 쓰려면: Chrome 오른쪽 위 ⋮ 메뉴 → '홈 화면에 추가'를 눌러요.";
}
$("ver").textContent = "버전 " + APP_VERSION;
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
if (!TTS) {
  $("pListen").disabled = true; $("pSlow").disabled = true;
  const android = /Android/i.test(navigator.userAgent);
  const chromeLink = "intent://" + location.host + location.pathname + "#Intent;scheme=https;package=com.android.chrome;end";
  $("ttsWarn").hidden = false;
  $("ttsWarn").innerHTML = "지금 연 브라우저에는 영어 읽어주기 기능이 없어서 듣기 버튼이 꺼져 있어요. 녹음과 발음 확인은 돼요." +
    (android ? ` <a href="${chromeLink}">Chrome에서 열기</a>` : " Safari나 Chrome에서 열어 주세요.");
}

/* ---------- 탭 ---------- */
const TABS = ["practice", "quiz", "claude"];
function setTab(name, save = true) {
  TABS.forEach(t => {
    $("tab-" + t).setAttribute("aria-selected", t === name);
    $("pane-" + t).hidden = t !== name;
  });
  if (save) store.set("iptgi-tab", name);
}
function syncTabs(c) {    // 이 카드에 AI 연습이 없으면 탭을 숨기고 퀴즈로
  const ai = hasAI(c);
  $("tab-claude").hidden = !ai;
  document.querySelector(".tabs").classList.toggle("two", !ai);
  let want = store.get("iptgi-tab", "practice");
  if (!TABS.includes(want) || (want === "claude" && !ai)) want = "practice";
  setTab(want, false);
}
TABS.forEach(t => $("tab-" + t).onclick = () => { if (t !== "practice") stopAll(); setTab(t); });


render();
</script>
